name: Deploy demo branch build

env:
  AWS_REGION: us-east-1

on:
  push:
    branches:
      - develop
      - demo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ui-deployment-${{ github.ref_name }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      output_build_s3: ${{ steps.artifact-upload-step.outputs.artifact-id }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        uses: borales/actions-yarn@v5
        with:
          cmd: install

      - name: Build
        uses: borales/actions-yarn@v5
        with:
          cmd: build
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          VITE_AWS_BUCKET_NAME: ${{ secrets.VITE_AWS_BUCKET_NAME }}
          VITE_AWS_REGION: ${{ secrets.VITE_AWS_REGION }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_HUB_APP_WORKSPACE_NAME: ${{ secrets.VITE_HUB_APP_WORKSPACE_NAME }}
          VITE_HUB_BASE_URL: ${{secrets.VITE_HUB_BASE_URL}}
          VITE_KEYCLOAK_CLIENT_ID: ${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
          VITE_KEYCLOAK_REALM: ${{ secrets.VITE_KEYCLOAK_REALM }}
          VITE_KEYCLOAK_URL: ${{ secrets.VITE_KEYCLOAK_URL }}
          VITE_SPARKGEO_BASE_URL: ${{ secrets.VITE_SPARKGEO_BASE_URL }}

      - name: Stage build files for upload to s3
        uses: actions/upload-artifact@v4
        id: artifact-upload-step
        with:
          name: s3_build
          path: ./dist

  deploy_s3:
    name: Deploy to S3
    env:
      output_build_s3: ${{needs.build.outputs.output_build_s3}}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{vars.GHA_AWS_DEPLOY_ROLE_EODH}} # Role in Sparkgeo Management account
          aws-region: us-east-1
      
      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create vitrual environment
        run: python3 -m venv .venv

      - name: Install Deploy Requirements
        run: .venv/bin/pip install -r iac/requirements.txt

      - name: CDK Deploy
        if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'iac/')
        run: cd iac && cdk deploy --all --require-approval never

      - name: Download artifacts and copy website to s3
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          name: s3_build

      - name: List files in ./dist for debugging
        run: ls -la ./dist

      - name: transfer to S3
        run: |
          aws s3 sync ./dist s3://${{ github.ref_name }}-eodhrc-website-files

      - name: invalidate cloudfront
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Aliases.Items, '${{ github.ref_name }}.eodhrc.sparkgeo.dev')].Id | [0]" --output text)
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"