<!DOCTYPE html>
<html>
  <head>
    <script>
      // this is to assist Keycloak with the issue using HashRouter.
      // It ensures that, after login, the URL is correctly transformed into a hash-based route.
      // Keycloak cannot preserve hash fragments (e.g., #/) in redirect URIs,
      // so we use this intermediary page to reconstruct the hash route.
      window.location.replace(`${location.origin}${location.pathname.replace(/\/[^/]*$/, '/') }#/`);
    </script>
  </head>
  <body></body>
</html>
